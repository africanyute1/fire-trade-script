name: Fetch market data

# Feeds the weekly trading report, which runs Saturday 12:00 UTC.
# We fetch BEFORE that so the committed data is already fresh:
#   - Friday 22:00 UTC  (after the US close, ~6pm ET) - primary
#   - Saturday 09:00 UTC (3 hours before the report)  - backup
# Plus a manual "Run workflow" button for testing.
on:
  schedule:
    - cron: '0 22 * * 5'
    - cron: '0 9 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate config only, make no API calls'
        required: false
        default: 'false'

# Least privilege: the job only needs to push the data files it generates.
permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and compute indicators
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No dependencies to cache - the script is standard library only.

      - name: Verify the API key secret exists
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "::error::TWELVEDATA_API_KEY secret is not set."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Secret is present (length ${#TWELVEDATA_API_KEY}). Value is never printed."

      - name: Validate configuration
        run: python3 scripts/fetch_market_data.py --dry-run

      - name: Fetch market data and compute indicators
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python3 scripts/fetch_market_data.py

      - name: Commit updated data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: market snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Committed and pushed."
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Market data fetch"
            echo ""
            if [ -f data/latest.md ]; then
              cat data/latest.md
            else
              echo "No data file was produced - check the logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: data/
          if-no-files-found: warn
          retention-days: 30
